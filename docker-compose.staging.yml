version: "3.8"
name: tezlify-staging

networks:
  tezlify-staging-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

services:
  # Staging PostgreSQL: 100% isolated container for staging tests.
  # NEVER connects to or mounts production database files.
  db:
    image: postgres:17-alpine
    container_name: tezlify-db-staging
    restart: always
    environment:
      POSTGRES_DB: tezlify_staging
      POSTGRES_USER: tezlify_staging
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:-staging_dev_pass_only}
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tezlify_staging -d tezlify_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tezlify-staging-internal

  caddy:
    image: caddy:2-alpine
    container_name: tezlify-caddy-staging
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${STAGING_HTTP_PORT:-8080}:80"
      - "${STAGING_HTTPS_PORT:-8443}:443"
    volumes:
      - /opt/tezlify-staging/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - /opt/tezlify-staging/frontend_candidate:/srv/frontend:ro
      - caddy_data_staging:/data
      - caddy_config_staging:/config
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - tezlify-staging-internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tezlify-backend-staging
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8000"
    env_file:
      - .env.staging
    environment:
      PORT: 8000
      ENVIRONMENT: "staging"
      DATABASE_URL: "postgresql+asyncpg://tezlify_staging:${STAGING_DB_PASSWORD:-staging_dev_pass_only}@db:5432/tezlify_staging"
      WHATSAPP_GATEWAY_URL: "http://gateway:8787"
      SKIP_JOB_RECOVERY: "true"
      TEZLIFY_COMPOSE_PROJECT: "tezlify-staging"
      TEZLIFY_COMPOSE_FILE: "/opt/tezlify/deploy/docker-compose.staging.yml"
      TEZLIFY_CONTAINER_SUFFIX: "-staging"
    volumes:
      - /opt/tezlify-staging/runtime:/opt/tezlify/runtime:ro
      - /opt/tezlify-staging/backups:/opt/tezlify/backups:rw
      - /opt/tezlify-staging/monitoring:/opt/tezlify/monitoring:ro
      - /run:/host/run:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:rw
      - /opt/tezlify-staging:/opt/tezlify/deploy:rw
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; res = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); exit(0 if res.status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - tezlify-staging-internal

  gateway:
    build:
      context: .
      dockerfile: whatsapp-gateway/Dockerfile
    container_name: tezlify-gateway-staging
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8787"
    env_file:
      - .env.staging
    environment:
      GATEWAY_PORT: 8787
      GATEWAY_HOST: 0.0.0.0
      BACKEND_WS_URL: ws://backend:8000/ws/gateway
      # SAFE STAGING INVARIANT: Auto-restore of WhatsApp sessions is disabled by default
      # in staging to eliminate any chance of reconnecting production sessions.
      WHATSAPP_AUTO_RESTORE: "false"
      GATEWAY_RESTORE_CONCURRENCY: "1"
      LOG_LEVEL: info
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - whatsapp_sessions_staging:/app/sessions
      - whatsapp_media_staging:/app/media
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:8787/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tezlify-staging-internal

volumes:
  postgres_data_staging:
  caddy_data_staging:
  caddy_config_staging:
  whatsapp_sessions_staging:
  whatsapp_media_staging:
