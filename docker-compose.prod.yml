version: "3.8"

networks:
  tezlify-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

services:
  caddy:
    image: caddy:2-alpine
    container_name: tezlify-caddy
    restart: always
    # Bounded json-file logs. Without this the log grows forever and the only
    # remedy was the panel's "clear logs", which TRUNCATES the file in place —
    # and truncation leaves the daemon's per-container log reader pointing past
    # EOF, so `docker logs` for that container blocks indefinitely afterwards
    # (measured 2026-10-01: 22 ms before, still hanging after 45 s once
    # truncated, 19 ms again after a restart). Rotation is done BY the daemon,
    # which keeps its reader consistent, so it has no such side effect.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/tezlify/frontend_candidate:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - tezlify-internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tezlify-backend
    restart: always
    # Bounded json-file logs — see the note on `caddy` above for why unbounded
    # logs are not merely untidy here.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8000"
    env_file:
      - .env.production
    environment:
      PORT: 8000
      FRONTEND_ORIGIN: "https://api.130.162.247.20.sslip.io"
      WHATSAPP_GATEWAY_URL: http://gateway:8787
      SKIP_JOB_RECOVERY: "true"
    volumes:
      - /opt/tezlify/runtime:/opt/tezlify/runtime:ro
      - /opt/tezlify/backups:/opt/tezlify/backups:ro
      - /opt/tezlify/monitoring:/opt/tezlify/monitoring:ro
      - /run:/host/run:ro
      # Operations Center: the docker CLI talks to the host daemon through this
      # socket to run ALLOWLISTED `docker compose` operations (restart / deploy)
      # defined in backend/app/services/admin/ops_service.py. Callers can never
      # supply a command; the operation name is mapped to a fixed argv server
      # side and every endpoint is behind `require_admin`.
      #
      # RISK (accepted deliberately): a mounted docker socket is root-equivalent
      # on the host. It is granted only because the panel must be able to
      # restart/deploy the very containers it runs in, and the blast radius is
      # bounded by (a) require_admin on every ops route, (b) the fixed allowlist
      # in ops_service.py, and (c) redaction of everything those routes return.
      - /var/run/docker.sock:/var/run/docker.sock
      # Operations Center "clear logs": docker has no clear-logs API, so the
      # daemon's json log file is TRUNCATED in place. The path is asked of the
      # daemon (`docker inspect --format {{.LogPath}}`) and mounted at the SAME
      # absolute path, so the reported path resolves inside this container.
      #
      # RISK (accepted deliberately): this grants write access to the daemon's
      # log files. It is bounded the same way the socket is — (a) require_admin
      # on the route, (b) the `LOG_SERVICES` allowlist gates the container NAME,
      # and (c) the path itself is never built from caller input, only from
      # `docker inspect`. No other file under this tree is ever opened.
      - /var/lib/docker/containers:/var/lib/docker/containers:rw
      # The compose project directory, so `docker compose -f` resolves and the
      # working tree can be updated during a deploy.
      - /opt/tezlify:/opt/tezlify/deploy:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; res = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); exit(0 if res.status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - tezlify-internal

  gateway:
    build:
      context: .
      dockerfile: whatsapp-gateway/Dockerfile
    container_name: tezlify-gateway
    restart: always
    # Bounded json-file logs — see the note on `caddy` above.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8787"
    env_file:
      - .env.production
    environment:
      GATEWAY_PORT: 8787
      GATEWAY_HOST: 0.0.0.0
      BACKEND_WS_URL: ws://backend:8000/ws/gateway
      # Restore WhatsApp sessions on gateway start (default).
      #
      # This was "false" in production, and the cost was invisible until it was
      # measured: every gateway restart left ZERO live sessions while the
      # database still reported the line as CONNECTED. The UI showed a healthy
      # session that could not receive a single message — the state behind the
      # unexplained `chats: 0`.
      #
      # The concern that motivated disabling it was "26 session directories on
      # disk would all reconnect". That is not what would happen:
      # `listRestorableSessions` INNER JOINs `whatsapp_sessions` and requires
      # `is_active` on BOTH the gateway row and the public row, so a deleted or
      # inactive session is filtered out in SQL and never reaches the gateway.
      # Verified against production: 26 directories, 1 restorable.
      #
      # Concurrency is 2 (GATEWAY_RESTORE_CONCURRENCY) and each reconnect is an
      # ordinary WhatsApp connection, so rate-limit behaviour is no worse than
      # an operator re-pairing by hand.
      WHATSAPP_AUTO_RESTORE: "true"
      GATEWAY_RESTORE_CONCURRENCY: "2"
      LOG_LEVEL: info
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - whatsapp_sessions:/app/sessions
      - whatsapp_media:/app/media
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:8787/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tezlify-internal

volumes:
  caddy_data:
  caddy_config:
  whatsapp_sessions:
  whatsapp_media:
