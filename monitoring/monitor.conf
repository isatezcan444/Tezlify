# ==============================================================================
# Tezlify Production Monitoring Configuration (Phase 10.2)
# Oracle VM: 130.162.247.20
# ==============================================================================

# Alerting Transport
# Options: none, webhook, telegram
ALERT_PROVIDER=none

# Webhook configuration (used if ALERT_PROVIDER=webhook)
ALERT_WEBHOOK_URL=

# Telegram configuration (used if ALERT_PROVIDER=telegram)
TELEGRAM_BOT_TOKEN=
TELEGRAM_CHAT_ID=

# Alert deduplication and cooldown
ALERT_COOLDOWN_MINUTES=60

# Public Edge Endpoints
PUBLIC_BASE_URL=https://api.130.162.247.20.sslip.io
API_HEALTH_URL=https://api.130.162.247.20.sslip.io/health
CADDY_HEALTH_URL=https://api.130.162.247.20.sslip.io/caddy-health

# Latency Thresholds (milliseconds)
WARN_API_LATENCY_MS=2000
CRIT_API_LATENCY_MS=5000

# Resource Thresholds
WARN_DISK_PERCENT=75
CRIT_DISK_PERCENT=90
WARN_RAM_PERCENT=80
CRIT_RAM_PERCENT=95
WARN_LOAD_PER_CORE=1.5
CRIT_LOAD_PER_CORE=2.5

# Database Thresholds
WARN_PG_CONN_PERCENT=70
CRIT_PG_CONN_PERCENT=85

# WhatsApp & Outbox Thresholds
WARN_OUTBOX_PENDING=100
CRIT_OUTBOX_PENDING=500
WARN_OUTBOX_AGE_SEC=600
CRIT_OUTBOX_AGE_SEC=1800

# Backup Thresholds (hours)
WARN_BACKUP_AGE_HOURS=26
CRIT_BACKUP_AGE_HOURS=48

# SSL Certificate Expiration (days)
WARN_SSL_DAYS=14
CRIT_SSL_DAYS=3

# HTTP Error Rate Thresholds (5xx count in last 5 minutes)
WARN_5XX_COUNT=10
CRIT_5XX_COUNT=50

# State and Log Paths
STATE_FILE=/opt/tezlify/monitoring/state.json
LATEST_HEALTH_FILE=/opt/tezlify/monitoring/latest_health.json
LOG_FILE=/opt/tezlify/logs/tezlify-monitor.log
BACKUP_DIR=/opt/tezlify/backups/postgres
BACKUPS_ROOT=/opt/tezlify/backups
